name: Build unsigned IPA

# 公开仓库的 macOS Runner 免费；未签名 IPA 可直接用于 AltStore / SideStore / TrollStore / 自签工具
on:
  workflow_dispatch:
    inputs:
      xcode:
        description: "Xcode 版本（留空 = latest-stable，例如 16.2）"
        required: false
        default: ""
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode != '' && inputs.xcode || 'latest-stable' }}

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -list -project Legado.xcodeproj

      - name: Archive without code signing
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Legado.xcodeproj \
            -scheme Legado \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Legado.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            | tee "$RUNNER_TEMP/archive.log"

      - name: Package unsigned IPA
        run: |
          APP=$(find "$RUNNER_TEMP/Legado.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -n 1)
          echo "app bundle: $APP"
          [ -n "$APP" ] || { echo "::error::未找到 .app，构建可能失败"; exit 1; }
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          IPA="Legado-$(date +%Y%m%d)-$(git rev-parse --short HEAD)-unsigned.ipa"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry "$IPA" Payload
          echo "IPA_NAME=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ runner.temp }}/${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 14
